# Builds the Android APK with Buildozer + python-for-android (p4a).
#
# Everything in this file is pinned on purpose -- see the comments, they explain
# the exact failures that showed up in the "Actions" tab before.
name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: # manual "Run workflow" button from the Actions tab

env:
  DEBIAN_FRONTEND: noninteractive
  # p4a must never wait for keyboard input in CI (auto-yes instead of prompting)
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

# Needed so the failure report can publish a check run ("Build log excerpt")
# and comment on the pull request; the build itself only needs to read the code.
permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  build-android:
    name: Build debug APK (Buildozer)
    # Pin an exact runner image. `ubuntu-latest` is Ubuntu 24.04 today and is
    # scheduled to become Ubuntu 26.04 on 2026-10-19, which would silently break
    # the toolchain install. Ubuntu 24.04 dropped the legacy `libncurses5-dev`,
    # `libncursesw5-dev` and `libtinfo5` packages that old Buildozer guides tell
    # you to install -- asking apt for them exits with "E: Unable to locate
    # package ..." / status 100, which is the failure every previous run had.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Gradle (used by p4a's bootstrap) needs JDK 17. setup-java also exports
      # JAVA_HOME, which is what buildozer uses to find javac/keytool.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # p4a requires Python >= 3.10 on the build machine.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint gettext \
            ccache cmake git lbzip2 make patch \
            libffi-dev libltdl-dev libncurses-dev libssl-dev libtinfo6 libtool \
            pkg-config python3 python3-dev python3-pip python3-venv \
            unzip wget zip zlib1g-dev
          java -version

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          # cython<3.2 is what p4a's pyjnius recipe asks for; buildozer's own
          # check_requirements() also aborts if the `cython` binary is missing.
          # `legacy-cgi` keeps buildozer working on Python versions where the
          # stdlib `cgi` module was removed.
          python -m pip install buildozer "cython<3.2" legacy-cgi virtualenv
          buildozer --version

      - name: Show effective buildozer.spec
        run: grep -vE '^[[:space:]]*(#|$)' buildozer.spec

      # Buildozer clones python-for-android into ~/.buildozer and then *keeps*
      # whatever clone it finds (it only re-pulls on `buildozer android update`),
      # so a stale checkout silently overrides `p4a.branch`. On CI that means a
      # pre-seeded or previously cached tree can build with a completely
      # different p4a than requested -- which is exactly the kind of
      # "recipe installs fine for them, fails for me" bug. Start clean.
      - name: Force a fresh python-for-android checkout
        run: rm -rf "$HOME/.buildozer/android/platform/python-for-android"

      - name: Build debug APK with Buildozer
        # First run downloads the Android SDK + NDK and cross-compiles
        # CPython, Kivy, numpy, Pillow and OpenCV: expect roughly 30-45 min.
        # `tee build.log` keeps a copy of the output on disk: buildozer's
        # chatter is tens of thousands of lines and the real error is buried
        # in it, so the report step below needs a file to grep.
        # The sed filter only affects what is echoed to the console: the runner
        # keeps ~10 annotations per job and otherwise thousands of harmless
        # "warning:"/"error code to be returned" compiler lines steal them all.
        run: |
          set -o pipefail
          buildozer --verbose android debug 2>&1 \
            | tee build.log \
            | sed -E '/warning:|[[:space:]]note:|to allow an error code/d'

      # Which python-for-android revision actually produced this build? With the
      # forced fresh checkout above this is the branch/HEAD from `p4a.branch`,
      # and quoting it makes "works for me / fails in CI" reports debuggable.
      - name: Record the python-for-android revision
        if: always()
        run: |
          p4a="$HOME/.buildozer/android/platform/python-for-android"
          if [ -d "$p4a/.git" ]; then
            git -C "$p4a" log -1 --format='python-for-android %h (%cd) %s' --date=short
            echo "branch: $(git -C "$p4a" rev-parse --abbrev-ref HEAD)"
          else
            echo "python-for-android was never cloned (build died before that step)"
          fi

      - name: Report the failure (check run + annotations + PR comment)
        # Without this a red "X" tells you nothing. The script finds the log
        # region that explains the failure and publishes it as a "Build log
        # excerpt" check run, an annotation, the job summary and a PR comment.
        # It always exits 0 so it never hides the real error.
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .ci/ci_failure_report.py

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: |
            build.log
            buildozer.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: OCR-Scanner-APK
          path: bin/*.apk
          if-no-files-found: error

# Builds the Android APK with Buildozer + python-for-android (p4a).
#
# Everything in this file is pinned on purpose -- see the comments, they explain
# the exact failures that showed up in the "Actions" tab before.
name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: # manual "Run workflow" button from the Actions tab

env:
  DEBIAN_FRONTEND: noninteractive
  # p4a must never wait for keyboard input in CI (auto-yes instead of prompting)
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

# Needed so the failure report can publish a check run ("Build log excerpt")
# and comment on the pull request; the build itself only needs to read the code.
permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

# Two pushes in a row used to cancel each other's *finished-so-far* work: GitHub's
# duplicate-run handling kills the older in-progress run, and the run that builds the
# APK takes 25-45 minutes, so the cancellation is what left a branch whose newest
# commit had no APK at all. Queue instead of cancelling: a build already under way is
# left alone and both complete.
#
# Observed behaviour worth knowing before anyone "improves" this: `false` protects a
# *running* job, not a queued one. A push that arrives while another run is still
# `pending` in this group gets that older pending run cancelled (seen on run
# 38644432729, head ae0cbb5, "cancelled" without anyone touching it). That is the
# wanted outcome here - superseded commits never need an APK, and the branch's newest
# head is always the one that gets built and uploaded - but it is NOT a guarantee
# that every push produces an artifact.
concurrency:
  group: ocr-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build debug APK (Buildozer)
    # Pin an exact runner image. `ubuntu-latest` is Ubuntu 24.04 today and is
    # scheduled to become Ubuntu 26.04 on 2026-10-19, which would silently break
    # the toolchain install. Ubuntu 24.04 dropped the legacy `libncurses5-dev`,
    # `libncursesw5-dev` and `libtinfo5` packages that old Buildozer guides tell
    # you to install -- asking apt for them exits with "E: Unable to locate
    # package ..." / status 100, which is the failure every previous run had.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Gradle (used by p4a's bootstrap) needs JDK 17. setup-java also exports
      # JAVA_HOME, which is what buildozer uses to find javac/keytool.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # p4a requires Python >= 3.10 on the build machine.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint gettext \
            ccache cmake git lbzip2 make patch \
            libffi-dev libltdl-dev libncurses-dev libssl-dev libtinfo6 libtool \
            pkg-config python3 python3-dev python3-pip python3-venv \
            unzip wget zip zlib1g-dev
          java -version

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          # cython<3.2 is what p4a's pyjnius recipe asks for; buildozer's own
          # check_requirements() also aborts if the `cython` binary is missing.
          # `legacy-cgi` keeps buildozer working on Python versions where the
          # stdlib `cgi` module was removed.
          python -m pip install buildozer "cython<3.2" legacy-cgi virtualenv
          buildozer --version

      - name: Check the .kv wiring against main.py
        # Kivy binds the UI to Python at runtime, so a .kv file can call a handler
        # that does not exist and every build step still succeeds - the app then
        # closes on the first tap on the phone. This is the only place that can
        # catch it, and it costs two seconds.
        run: python3 .ci/check_kv_wiring.py

      - name: Test the OCR result pipeline
        # extract_numbers() only runs when a real engine is importable, which is
        # never true on the Android host, so its candidate/scoring layer is tested
        # here instead, against a stubbed engine.
        run: |
          python -m pip install --quiet opencv-python-headless numpy
          python tests/test_ocr_pipeline.py

      - name: Show effective buildozer.spec
        run: grep -vE '^[[:space:]]*(#|$)' buildozer.spec

      # Buildozer clones python-for-android into ~/.buildozer and then *keeps*
      # whatever clone it finds (it only re-pulls on `buildozer android update`),
      # so a stale checkout silently overrides `p4a.branch`. On CI that means a
      # pre-seeded or previously cached tree can build with a completely
      # different p4a than requested -- which is exactly the kind of
      # "recipe installs fine for them, fails for me" bug. Start clean.
      - name: Force a fresh python-for-android checkout
        run: rm -rf "$HOME/.buildozer/android/platform/python-for-android"

      - name: Build debug APK with Buildozer
        # First run downloads the Android SDK + NDK and cross-compiles
        # CPython, Kivy, numpy and OpenCV: expect roughly 30-45 min.
        # `tee build.log` keeps a copy of the output on disk: buildozer's
        # chatter is tens of thousands of lines and the real error is buried
        # in it, so the report step below needs a file to grep.
        # The sed filter only affects what is echoed to the console: the runner
        # keeps ~10 annotations per job and otherwise thousands of harmless
        # "warning:"/"error code to be returned" compiler lines steal them all.
        run: |
          set -o pipefail
          buildozer --verbose android debug 2>&1 \
            | tee build.log \
            | sed -E '/warning:|[[:space:]]note:|to allow an error code/d'

      # Which python-for-android revision actually produced this build? With the
      # forced fresh checkout above this is the branch/HEAD from `p4a.branch`,
      # and quoting it makes "works for me / fails in CI" reports debuggable.
      - name: Record the python-for-android revision
        if: always()
        run: |
          p4a="$HOME/.buildozer/android/platform/python-for-android"
          if [ -d "$p4a/.git" ]; then
            git -C "$p4a" log -1 --format='python-for-android %h (%cd) %s' --date=short
            echo "branch: $(git -C "$p4a" rev-parse --abbrev-ref HEAD)"
          else
            echo "python-for-android was never cloned (build died before that step)"
          fi

      - name: Report the failure (check run + annotations + PR comment)
        # Without this a red "X" tells you nothing. The script finds the log
        # region that explains the failure and publishes it as a "Build log
        # excerpt" check run, an annotation, the job summary and a PR comment.
        # It always exits 0 so it never hides the real error.
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .ci/ci_failure_report.py

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: |
            build.log
            buildozer.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: OCR-Scanner-APK
          path: bin/*.apk
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Boot the app on a real Android instead of trusting that "an APK exists".
  #
  # The arm64 job above can only prove the *build* works. Every failure that has
  # actually been reported from a phone - a .kv file calling a method that does not
  # exist, an interface laid out into a 400x750 box, an exception thrown while the
  # first frame is being built - is invisible to it, because Kivy resolves the UI at
  # runtime. Running the app is the only way to see those, so this job does exactly
  # that: build the same code for the emulator's architecture, install it, launch it
  # and assert on what logcat says (see .ci/emulator_boot_test.sh).
  #
  # It duplicates the setup steps instead of sharing them: the arm64 job is the one
  # that produces the APK people install, and it should keep working even while this
  # job's plumbing changes.
  # --------------------------------------------------------------------------
  boot-test:
    name: Boot the APK on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint gettext \
            ccache cmake git lbzip2 make patch \
            libffi-dev libltdl-dev libncurses-dev libssl-dev libtinfo6 libtool \
            pkg-config python3 python3-dev python3-pip python3-venv \
            unzip wget zip zlib1g-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython<3.2" legacy-cgi virtualenv

      # x86_64 only, and only for this job: an arm64 APK cannot be installed on an
      # x86_64 emulator at all (there is no translation layer for it), so testing a
      # device run means producing a second APK. The phone keeps getting the arm64
      # one from the job above.
      - name: Build for the emulator architecture
        run: |
          set -o pipefail
          sed -i 's/^android\.archs = .*/android.archs = x86_64/' buildozer.spec
          grep '^android.archs' buildozer.spec
          rm -rf "$HOME/.buildozer/android/platform/python-for-android"
          buildozer --verbose android debug 2>&1 \
            | tee build.log \
            | sed -E '/warning:|[[:space:]]note:|to allow an error code/d'

      - name: Boot the APK and check it stayed up
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Drive the app past "it opened": after the layout verdict the script
          # relaunches the activity with an image to read, so the engine packaged
          # into this build is exercised on a device through run_ocr() - the same
          # call the SCAN button makes - and CI asserts on what it recognised.
          #
          # PROBE_STRICT is 0 while the fixture is new: "the scan produced nothing"
          # or "it read a different string" is then a warning with the screenshot and
          # logcat attached, instead of a red build over an engine-quality question.
          # Flip it to 1 (the script's default) as soon as one run has read the
          # number - from then on the pipeline owns the whole claim, not just the
          # claim that the app starts.
          OCR_PROBE: 1
          PROBE_IMAGE: tests/fixtures/ci_probe_card.png
          PROBE_EXPECT: U6234
          PROBE_STRICT: 0
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .ci/emulator_boot_test.sh "$(ls bin/*.apk | head -1)"

      # The same reporter the build job uses, pointed at the device log: logcat is
      # the only output of a phone run that can be read from outside the runner, and
      # this is what carries an OCRDIAG record or a Python traceback into a check run.
      - name: Report a boot failure (check run + annotations)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FAILURE_LOG: emulator-logcat.txt
          CHECK_NAME: Emulator boot log
          FAILURE_LABEL: Emulator boot test failed
        run: python .ci/ci_failure_report.py

      - name: Upload the emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-evidence
          path: |
            emulator-logcat.txt
            emulator-screenshot.png
            ui-report.txt
            boot-problems.txt
          if-no-files-found: ignore

      - name: Upload the x86_64 APK (emulator testing only, do not install)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OCR-Scanner-APK-x86_64
          path: bin/*.apk
          if-no-files-found: ignore
